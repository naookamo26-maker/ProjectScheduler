[pytest]
testpaths = tests

# 出力は既定で最小限にする（トークン節約）。詳細が要るときだけ -v / --tb=long を付ける。
addopts = -q --no-header --tb=short -ra

# テストの分類（コストの階層 = 必要な依存パッケージの階層）。
# どのマーカーを選ぶかは CLAUDE.md「テストの実行範囲」の対応表を参照。
markers =
    core: Qt非依存・pandas非依存。pytestだけで動く（gui/db.py, gui/db_schema.py, gui/undo_manager.py）
    scheduler: Qt非依存だがpandas/numpyが必要（project_scheduler.py, gui/gantt_generator.py）
    gui: PySide6と対応するシステムライブラリが必要。最も重い（gui/ のウィジェット層・描画層）
