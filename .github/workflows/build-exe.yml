name: Build Windows exe

# PyInstallerはクロスコンパイル非対応のため、Windows用.exeはwindows-latest
# ランナー上でビルドする。開発環境（Linuxコンテナ）ではこのspecの妥当性を
# ビルドが通ることまでは確認できるが、実際の.exeバイナリはここでのみ生成される。
# 詳細は docs/packaging.md を参照。

on:
  # 無料プランではArtifactの保存容量に上限があるため、pushのたびに自動で
  # ビルドするのはやめ、必要なときにActionsタブから手動で実行する。
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller packaging/ProjectSchedulerGUI.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSchedulerGUI-windows
          # --onefile構成のため、生成物は dist/ProjectSchedulerGUI.exe の1ファイルのみ。
          path: dist/ProjectSchedulerGUI.exe
          if-no-files-found: error
          # 保存容量を圧迫しないよう、既定の90日ではなく短期間で自動削除する。
          # 必要な.exeはこの期間内にダウンロードしておく。
          retention-days: 7
